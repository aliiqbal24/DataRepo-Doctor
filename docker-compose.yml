name: datarepo-doctor
services:
  minio:
    profiles: ["test"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-demo_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-admin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 30

  postgres:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datarepo_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change-me-postgres-admin}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datarepo_demo"]
      interval: 3s
      timeout: 2s
      retries: 30

  minio-init:
    profiles: ["test"]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/datarepo-demo &&
        (mc admin user add local "$${DOCTOR_S3_ACCESS_KEY}" "$${DOCTOR_S3_SECRET_KEY}" || true) &&
        mc admin policy create local doctor-reader /policy/doctor-reader-policy.json &&
        mc admin policy attach local doctor-reader --user "$${DOCTOR_S3_ACCESS_KEY}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-demo_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-admin}
      DOCTOR_S3_ACCESS_KEY: ${DOCTOR_S3_ACCESS_KEY:-doctor_reader}
      DOCTOR_S3_SECRET_KEY: ${DOCTOR_S3_SECRET_KEY:-change-me-doctor-s3}
    volumes: ["./infra/doctor-reader-policy.json:/policy/doctor-reader-policy.json:ro"]
    depends_on:
      minio: {condition: service_healthy}
    restart: "no"

  configure:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "datarepo_doctor.seed"]
    user: root
    environment:
      ROAPI_CONFIG_PATH: /generated/roapi.yaml
    volumes: ["generated:/generated"]
    restart: "no"

  local-seed:
    profiles: ["test"]
    build:
      context: .
      target: runtime
    command: ["python", "-m", "datarepo_doctor.seed", "--local-fixtures"]
    user: root
    env_file: [.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-demo_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-admin}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change-me-postgres-admin}
      DOCTOR_S3_ACCESS_KEY: ${DOCTOR_S3_ACCESS_KEY:-doctor_reader}
      DOCTOR_S3_SECRET_KEY: ${DOCTOR_S3_SECRET_KEY:-change-me-doctor-s3}
      DOCTOR_POSTGRES_PASSWORD: ${DOCTOR_POSTGRES_PASSWORD:-change-me-doctor-postgres}
      DOCTOR_S3_ENDPOINT: http://minio:9000
      DOCTOR_S3_BUCKET: datarepo-demo
      DOCTOR_POSTGRES_DSN: postgresql://doctor_reader:${DOCTOR_POSTGRES_PASSWORD:-change-me-doctor-postgres}@postgres:5432/datarepo_demo
    depends_on:
      minio-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    restart: "no"

  roapi:
    build:
      context: .
      dockerfile: infra/roapi.Dockerfile
    command: ["-c", "/config/roapi.yaml"]
    environment:
      AWS_REGION: us-west-2
      AWS_SKIP_SIGNATURE: "true"
    ports: ["8080:8080"]
    volumes: ["generated:/config:ro"]
    depends_on:
      configure: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/schema')"]
      interval: 3s
      timeout: 2s
      retries: 30

  app:
    build:
      context: .
      target: runtime
    env_file: [.env]
    environment:
      DOCTOR_ROAPI_URL: http://roapi:8080
      DOCTOR_RNACENTRAL_DSN: postgresql://reader:${DOCTOR_RNACENTRAL_PASSWORD:-replace-with-public-reader-password}@hh-pgsql-public.ebi.ac.uk:5432/pfmegrnargs
      DOCTOR_DATABASE_URL: sqlite:////data/datarepo-doctor.db
      AWS_SKIP_SIGNATURE: "true"
    ports: ["8000:8000"]
    volumes: ["app-data:/data"]
    depends_on:
      configure: {condition: service_completed_successfully}
      roapi: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    command: ["pytest", "-p", "no:cacheprovider", "-m", "integration"]
    env_file: [.env]
    environment:
      DOCTOR_S3_ENDPOINT: http://minio:9000
      DOCTOR_ROAPI_URL: http://roapi:8080
      DOCTOR_POSTGRES_DSN: postgresql://doctor_reader:${DOCTOR_POSTGRES_PASSWORD:-change-me-doctor-postgres}@postgres:5432/datarepo_demo
      DOCTOR_RNACENTRAL_DSN: postgresql://reader:${DOCTOR_RNACENTRAL_PASSWORD:-replace-with-public-reader-password}@hh-pgsql-public.ebi.ac.uk:5432/pfmegrnargs
      DOCTOR_DATABASE_URL: sqlite:////tmp/datarepo-doctor-test.db
      DOCTOR_SCHEDULES_ENABLED: "false"
      AWS_ALLOW_HTTP: "true"
      AWS_S3_ALLOW_UNSAFE_RENAME: "true"
      AWS_SKIP_SIGNATURE: "true"
    depends_on:
      local-seed: {condition: service_completed_successfully}
      roapi: {condition: service_healthy}

volumes:
  minio-data:
  postgres-data:
  app-data:
  generated:
