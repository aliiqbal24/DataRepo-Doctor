[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datarepo-doctor"
version = "0.1.0"
description = "DataRepo-native bounded synthetic retrieval monitor"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "data-repository==0.0.2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
datarepo-doctor = "datarepo_doctor.main:run"
datarepo-doctor-seed = "datarepo_doctor.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datarepo_doctor", "demo_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
markers = ["integration: requires Docker Compose services", "e2e: full browser flow"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["datarepo_doctor"]
exclude = ["demo_catalog"]

[[tool.mypy.overrides]]
module = [
  "boto3.*",
  "botocore.*",
  "datarepo.*",
  "deltalake.*",
  "polars.*",
  "psycopg.*",
  "pyarrow.*",
  "uvicorn.*",
  "yaml.*",
]
ignore_missing_imports = true
